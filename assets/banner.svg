<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="vmwareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="hypervGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.25)" />
    </pattern>

    <!-- Soft Blur Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #ffffff;
    }
    .floating-node {
      animation: float 6s ease-in-out infinite;
    }
    .pulse-glow {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .stream-line {
      stroke-dasharray: 8 12;
      animation: stream 12s linear infinite;
    }
    .data-particle {
      animation: moveParticle 5s linear infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse {
      0% { opacity: 0.25; transform: scale(0.98); }
      100% { opacity: 0.55; transform: scale(1.02); }
    }
    @keyframes stream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Deep Backdrop -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="180" fill="#38bdf8" filter="url(#glow)" class="pulse-glow" style="transform-origin: 150px 80px;" />
  <circle cx="1050" cy="280" r="200" fill="#6366f1" filter="url(#glow)" class="pulse-glow" style="transform-origin: 1050px 280px; animation-delay: -2s;" />

  <!-- Precision Mesh / Grid Layer -->
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Data Flow Streams (Background Behind Text) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50,180 Q 300,60 600,180 T 1150,180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 50,220 Q 350,320 650,200 T 1150,140" fill="none" stroke="#818cf8" stroke-width="1.5" style="animation-duration: 8s;" />
    <path class="stream-line" d="M 100,100 C 400,20 800,340 1100,100" fill="none" stroke="#c084fc" stroke-width="1.5" style="animation-duration: 15s;" />
  </g>

  <!-- Dynamic Interactive Floating Background Cards -->
  <g class="floating-node" style="animation-duration: 7s;">
    <!-- VMware VM Node Card -->
    <rect x="940" y="55" width="200" height="70" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="970" cy="90" r="16" fill="url(#vmwareGrad)" />
    <text x="970" y="95" text-anchor="middle" font-size="14" fill="#fff" font-family="sans-serif">⚡</text>
    <text x="1000" y="82" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">VMware vSphere</text>
    <text x="1000" y="101" font-family="sans-serif" font-weight="500" font-size="11" fill="#38bdf8">CBT Snapshot Sync</text>
  </g>

  <g class="floating-node" style="animation-duration: 9s; animation-delay: -3s;">
    <!-- Hyper-V Node Card -->
    <rect x="940" y="150" width="200" height="70" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    <circle cx="970" cy="185" r="16" fill="url(#hypervGrad)" />
    <text x="970" y="190" text-anchor="middle" font-size="14" fill="#fff" font-family="sans-serif">🛡️</text>
    <text x="1000" y="177" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Microsoft Hyper-V</text>
    <text x="1000" y="196" font-family="sans-serif" font-weight="500" font-size="11" fill="#818cf8">VSS / RCT Protection</text>
  </g>

  <g class="floating-node" style="animation-duration: 8s; animation-delay: -1.5s;">
    <!-- Disaster Recovery Card -->
    <rect x="940" y="245" width="200" height="70" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
    <circle cx="970" cy="280" r="16" fill="url(#primaryGrad)" />
    <text x="970" y="285" text-anchor="middle" font-size="14" fill="#fff" font-family="sans-serif">🔄</text>
    <text x="1000" y="272" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Instant Recovery</text>
    <text x="1000" y="291" font-family="sans-serif" font-weight="500" font-size="11" fill="#c084fc">Near-Zero RTO / RPO</text>
  </g>

  <!-- Foreground Title and Content -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Tag -->
    <rect x="0" y="45" width="230" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="14" cy="59" r="4" fill="#38bdf8" />
    <text x="26" y="63" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED BCDR DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="125" class="title">
      Awesome <tspan fill="url(#primaryGrad)">VMware &amp; Hyper-V</tspan>
    </text>
    <text x="0" y="172" class="title">
      Virtual Machine Backup
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" class="subtitle">
      Enterprise SaaS Solutions &amp; Open-Source BCDR Platforms for Virtual Workloads
    </text>
    <text x="0" y="240" class="subtitle" font-size="14" fill="#64748b">
      Complete guides, tier pricing, free limits, corporate valuation benchmarks &amp; star metrics.
    </text>

    <!-- Bottom Badges / Tech Tags -->
    <g transform="translate(0, 275)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="20" text-anchor="middle" class="badge-text">⚡ VMware ESXi</text>

      <!-- Badge 2 -->
      <rect x="142" y="0" width="136" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="210" y="20" text-anchor="middle" class="badge-text">🛡️ Hyper-V BCDR</text>

      <!-- Badge 3 -->
      <rect x="290" y="0" width="138" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="359" y="20" text-anchor="middle" class="badge-text">☁️ Cloud SaaS</text>

      <!-- Badge 4 -->
      <rect x="440" y="0" width="144" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="512" y="20" text-anchor="middle" class="badge-text">🔓 Open Source</text>
    </g>
  </g>
</svg>
